# config/config.toml — single source of truth for all runtime settings.
# Loaded via src/config.py (stdlib tomllib + pydantic v2).
# All paths are relative to the project root.

[project]
name    = "quant-fin"
version = "0.1.0"

# ── Data sources ──────────────────────────────────────────────────────────────
[data]
# Primary historical source for daily bars.
# "nse_bhavcopy"     = official NSE end-of-day CSV files (survivorship-documentable).
# "dhan_historical"  = Dhan intraday/daily bars stored in ohlcv_intraday table.
# NOTE: Every backtest report MUST flag whether it ran on 'daily' or 'minute' data.
# Intraday-edge conclusions require minute-level data (dhan_historical or supplied dataset).
historical_source = "dhan_historical"

# Live data source for the paper-trading engine.
# "dhan"   = Dhan WebSocket feed (requires DHAN_CLIENT_ID + DHAN_ACCESS_TOKEN in .env).
# "upstox" = Upstox free-tier WebSocket (requires UPSTOX_API_KEY + UPSTOX_ACCESS_TOKEN).
# Swap to "upstox" after Dhan subscription expires — no code changes needed, config only.
live_data_source = "dhan"

data_dir      = "data"
snapshots_dir = "data/snapshots"
duckdb_path   = "data/market.duckdb"
sqlite_path   = "data/state.db"

# ── Dhan API ──────────────────────────────────────────────────────────────────
[dhan]
# Credentials are NEVER stored here — read from .env:
#   DHAN_CLIENT_ID=...
#   DHAN_ACCESS_TOKEN=...
#
# TODO (on key arrival): set DHAN_ADJUSTMENT_STATUS in .env to confirm whether
# Dhan historical data is pre-adjusted for corporate actions:
#   DHAN_ADJUSTMENT_STATUS=PRE_ADJUSTED    (if Dhan adjusts server-side — likely)
#   DHAN_ADJUSTMENT_STATUS=RAW             (if unadjusted — apply our layer)
# Until set, DhanDataSource warns on every historical query.

base_url             = "https://api.dhan.co/v2"
instrument_master_url = "https://images.dhan.co/api-data/api-scrip-master.csv"

# Bulk downloader pacing (respect Dhan's rate limits).
request_delay_seconds = 1.0    # sleep between consecutive API calls
max_retries           = 10     # per-chunk retry attempts before marking FAILED
days_per_chunk        = 90     # Dhan historical API cap per request (~90 calendar days)
backoff_base_seconds  = 1.0    # exponential backoff base for 429/5xx errors

# ── Stock universe ────────────────────────────────────────────────────────────
[universe]
# NSE F&O segment — derived from database via tools/build_universe.py (2026-07-11).
# DO NOT hand-edit this list. Instead run:
#   python tools/build_universe.py --output-toml
# then paste the output here and commit.
#
# Eligibility rules (applied by build_universe.py):
#   Rule 1  symbol has rows in ohlcv_intraday with timeframe='1'
#   Rule 2  MAX(ts)::DATE >= '2026-01-01'  (data covers the sealed test period)
#   Rule 3  COUNT(DISTINCT CAST(ts AS DATE)) >= 600  (~80% of the 3-year window)
#
# Symbols use NSE ticker format.  "M&M" and "BAJAJ-AUTO" contain special chars —
# these are the official NSE symbols and must not be normalised away.
#
# INTERIM universe: 109 symbols (derived 2026-07-11)
# TARGET universe:  ~114 symbols — add the 5 ELIGIBLE-PENDING-REDOWNLOAD symbols
#                   once re-downloaded on the 3060 (see tools/build_universe.py).
#
# EXCLUDED symbols (do not add without re-downloading):
#   CHOLAFIN     -- API returned empty data on 3060 (security_id mismatch); eligible once fixed
#   LTIM         -- all retries exhausted; instrument-master security_id issue; eligible once fixed
#   MCDOWELL-N   -- hyphenated ticker causes instrument-master lookup failure; eligible once fixed
#   TATAMOTORS   -- all retries exhausted; instrument-master security_id issue; eligible once fixed
#   ZOMATO       -- all retries exhausted; instrument-master security_id issue; eligible once fixed
#   ADANIPORTS   -- incomplete download (4/13 chunks done, data ends 2025-06-23); re-download needed
#   360ONE       -- only 71 trading days (listed too recently for full 3-year window)

symbols = [
  "ABB",        "ACC",        "ADANIENT",   "AMBUJACEM",  "APOLLOHOSP",
  "ASIANPAINT", "AUROPHARMA", "AXISBANK",   "BAJAJ-AUTO", "BAJAJFINSV",
  "BAJFINANCE", "BALKRISIND", "BANDHANBNK", "BANKBARODA", "BATAINDIA",
  "BEL",        "BHARTIARTL", "BHEL",       "BIOCON",     "BOSCHLTD",
  "BPCL",       "BRITANNIA",  "CANBK",      "CIPLA",      "COALINDIA",
  "CONCOR",     "CUMMINSIND", "DIVISLAB",   "DMART",      "DRREDDY",
  "EICHERMOT",  "ESCORTS",    "EXIDEIND",   "FEDERALBNK", "GAIL",
  "GODREJCP",   "GRANULES",   "GRASIM",     "HAL",        "HAVELLS",
  "HCLTECH",    "HDFCBANK",   "HDFCLIFE",   "HEROMOTOCO", "HINDALCO",
  "HINDUNILVR", "ICICIBANK",  "IDFCFIRSTB", "IGL",        "INDHOTEL",
  "INDIGO",     "INDUSINDBK", "INFY",       "IRCTC",      "ITC",
  "JSWSTEEL",   "JUBLFOOD",   "KOTAKBANK",  "KPITTECH",   "LICHSGFIN",
  "LT",         "LUPIN",      "M&M",        "MANAPPURAM", "MARUTI",
  "MGL",        "MOTHERSON",  "MPHASIS",    "MUTHOOTFIN", "NATIONALUM",
  "NAUKRI",     "NESTLEIND",  "NMDC",       "NTPC",       "OFSS",
  "ONGC",       "PAGEIND",    "PERSISTENT", "PETRONET",   "PFC",
  "PIIND",      "PNB",        "POLYCAB",    "POWERGRID",  "RBLBANK",
  "RECLTD",     "RELIANCE",   "RVNL",       "SAIL",       "SBILIFE",
  "SBIN",       "SHREECEM",   "SIEMENS",    "SUNPHARMA",  "TATACONSUM",
  "TATAELXSI",  "TATAPOWER",  "TATASTEEL",  "TCS",        "TECHM",
  "TITAN",      "TORNTPHARM", "TRENT",      "TVSMOTOR",   "ULTRACEMCO",
  "UPL",        "VEDL",       "VOLTAS",     "WIPRO",
]
# 109 symbols derived 2026-07-11 (Rule 2 >= 2026-01-01, Rule 3 >= 600 days)

# ── Trading / paper engine ────────────────────────────────────────────────────
[trading]
# Virtual rupees.  NEVER hard-code this value anywhere else in the codebase.
# All sizing, risk, and P&L calculations must read from config.trading.token_pool.
token_pool = 500_000

# Prediction horizons.  primary_horizon_min is the default output; all three are
# always produced so the "cone must widen with horizon" property can be validated.
primary_horizon_min      = 30
additional_horizons_min  = [15, 60]

# NSE continuous session.  Pre-open auction (09:00–09:15) excluded from tick features.
market_open    = "09:15"
market_close   = "15:30"
square_off_time = "15:15"   # MIS positions auto-squared off before 15:30

# Hard guardrails from DESIGN.md §12 — cannot be overridden at runtime.
max_position_pct           = 0.10   # max 10 % of pool per trade
max_intraday_exposure_pct  = 0.40   # max 40 % total intraday exposure
max_delivery_exposure_pct  = 0.50   # max 50 % delivery exposure
min_cash_reserve_pct       = 0.10   # always keep ≥ 10 % cash
drawdown_pause_pct         = 0.20   # pause new entries if pool drops 20 % from peak
max_sector_exposure_pct    = 0.25   # no single sector > 25 % exposure

# ── Cost simulation rates ─────────────────────────────────────────────────────
# All rates are for NSE equity cash segment, intraday MIS orders.
# When official rates change, update ONLY these values — no code changes required.
# Verify against: NSE fee schedule, CBDT STT circular, SEBI circular, GST Act.
[trading.costs]

# Brokerage model.
#   "flat"       — always brokerage_flat_cap per order, regardless of size.
#   "percentage" — min(brokerage_pct × turnover, brokerage_flat_cap) per order.
# Source: Zerodha / Fyers discount-broker fee structure; as-of 2024-07-01.
brokerage_model    = "percentage"
brokerage_pct      = 0.0003    # 0.03% of order turnover
brokerage_flat_cap = 20.0      # ₹20 cap per order (intraday MIS)

# Securities Transaction Tax — intraday equity.
# Applied on the SELL leg only (both LONG exits and SHORT entries).
# Finance Act 2024 (effective 2024-07-23) raised STT on F&O only; equity cash
# intraday rate confirmed unchanged at 0.025% on sell side.
# Source: Finance Act 2024, Schedule STT; verified 2026-07-14.
stt_intraday_sell_pct = 0.00025    # 0.025% of sell-leg turnover

# NSE equity cash segment transaction charges.
# Applied per side (buy AND sell independently); code applies to total turnover,
# which is mathematically equivalent (rate × buy + rate × sell = rate × total).
# ₹2.97 per lakh per side — post SEBI flat-fee reform effective Oct 2024.
# Source: NSE fee circular (SEBI reform Oct 2024); verified against broker fee
# schedules (Zerodha, Groww) 2026-07-14. Pre-reform was ₹3.25/lakh.
exchange_charges_pct = 0.0000297   # ₹2.97 per lakh of turnover per side (= 0.00297%)

# SEBI turnover fees — applied on total (buy + sell) turnover.
# SEBI fees became subject to 18% GST from April 2025; they are correctly included
# in gst_base = brokerage + exchange + sebi_fees — no code change needed.
# Source: SEBI circular; ₹10/crore rate unchanged; GST treatment verified 2026-07-14.
sebi_fees_pct = 0.000001           # ₹10 per crore (= ₹0.10 per lakh = 0.0001%)

# GST on (brokerage + exchange charges + SEBI fees).
# SEBI fees included from April 2025 (government levy, previously exempt).
# NOT applied on STT or stamp duty (those are separate statutory levies).
# Source: GST Act India, standard rate; SEBI fee treatment confirmed 2026-07-14.
gst_pct = 0.18                     # 18%

# Stamp duty — applied on the BUY leg only.
# Source: Indian Stamp Act 2019, Schedule I Art. 5(c); effective 2020-07-01.
stamp_duty_intraday_buy_pct = 0.00003   # 0.003% of buy-leg turnover

# ── Slippage estimates ────────────────────────────────────────────────────────
# All values are ESTIMATES — slippage is modelled, not measured.
# "fixed_bps" applies uniform bps at entry and exit, always unfavourably.
# When model or bps change, update ONLY these values — no code changes required.
[trading.slippage]
model     = "fixed_bps"
entry_bps = 2.0   # 2 bps = 0.02% at entry (conservative mid-cap NSE estimate)
exit_bps  = 2.0   # 2 bps = 0.02% at exit

# ── Allocator — position sizing and hard guardrails ───────────────────────────
# Fractional Kelly + volatility scaling. Selection (scanner) and sizing (allocator)
# are SEPARATE concerns — sizing logic must NOT influence scanner ranking.
#
# Sizing formula:
#   kelly_f = after_cost_ev_pct / stop_loss_pct
#   raw_pct = kelly_fraction × kelly_f × min(vol_target_pct / est_vol, max_vol_scalar)
#
# Why fractional (not full) Kelly: ML confidence is imperfect; full Kelly with an
# overconfident model leads to ruin. Quarter-Kelly halves bet-sequence volatility
# at the cost of ~13% lower long-run growth — acceptable for imperfect estimates.
[trading.allocator]
kelly_fraction = 0.25   # quarter-Kelly (conservative; change to 0.5 only with validated calibration)
vol_target_pct = 1.0    # target daily volatility % for scaling
max_vol_scalar = 2.0    # cap on vol scaling multiplier (prevents over-sizing low-vol stocks)

# ── Scanner — candidate funnel ────────────────────────────────────────────────
# Filters run cheapest first; only survivors reach the EV scoring stage.
# Ranking is by AFTER-COST EXPECTED VALUE — NOT raw model confidence.
# A high-confidence tiny-move candidate that costs more than it makes must rank
# BELOW a moderate-confidence larger-move candidate that nets positive after costs.
[trading.scanner]
max_shortlist_size        = 10     # top N candidates to surface each scan
min_confidence            = 0.55   # model confidence floor: P(direction correct)
min_expected_move_pct     = 0.10   # minimum predicted price move (%) to even score
min_avg_daily_volume_cr   = 1.0    # liquidity gate: min ₹1cr average daily value
min_volume_ratio          = 0.30   # activity gate: today's vol / 20-day average
representative_qty        = 50     # shares used for round-trip cost estimation
                                   # (cost_pct at ₹1000/share ≈ 0.106%; lower for
                                   #  expensive stocks once brokerage cap kicks in)

# ── Model / ML ────────────────────────────────────────────────────────────────
[model]
random_seed = 42   # fixed for reproducibility (DESIGN.md rule 5)

# CPU usage cap to prevent system freezing/crashing during preprocessing/fallback.
# e.g., set to 10 if you have 12 cores, to leave 2 cores for the OS.
max_cpu_cores = 10

# Quantile levels for the LightGBM cone.
# Must include 0.50 (median = expected drift); outer bands validated for coverage.
quantile_levels = [0.10, 0.25, 0.50, 0.75, 0.90]

# ── Seed weights ──────────────────────────────────────────────────────────────
# Research-backed initial weights for NSE intraday F&O universe.
# Applied at cold-start (day one) and during ramp-up (n_obs < min_observations_per_label).
# Weights NEVER hand-tuned against backtest results.  Changes require the validation
# gate to pass on held-out data.
[model.seeds]
market_regime  = 0.25   # Nifty/VIX regime — dominant NSE intraday factor
fo_signals     = 0.25   # PCR, OI, max-pain, basis — India-specific documented edge
price_momentum = 0.20   # Momentum/microstructure — decays fast in liquid stocks
sentiment      = 0.15   # FinBERT — noisy but non-zero in mid-caps
institutional  = 0.10   # FII/DII EOD context + sector relative strength (slow-moving)
calendar       = 0.05   # Open-auction effect + time-of-day bucket

# Gating: all three gates must pass before a weight update is accepted
min_observations_per_label           = 50      # per class label in live validation set
max_weight_change_per_update         = 0.05    # no group moves >5% in one weekly cycle
validation_gate_min_brier_improvement = 0.005  # must beat prior Brier score by >=0.5%
shrinkage_factor                     = 0.5     # blend toward seed when n_obs < minimum

# ── Experiment tracking ───────────────────────────────────────────────────────
[experiment]
db_path = "data/runs.db"   # SQLite; every run records config hash + metrics

# ── Logging ───────────────────────────────────────────────────────────────────
[logging]
level   = "INFO"
log_dir = "logs"
